<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TreeWebGl</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
     <style>
 html, body {
  margin: 20px;
  padding: 0px;
  overflow-y: auto;
  overflow-x: hidden;
}
#unity-container {
  margin: 20px auto;   /* centers horizontally, adds some top/bottom spacing */
  padding-top: 542px;
  
  width: 720px;
  height: 1280px;
}

#unity-canvas {
  width: 100% !important;
  height: 100% !important;
}

 #unity-loading-bar, #unity-warning {
        text-align: center;
        color: white;
        font-family: sans-serif;
       }
      

    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <!-- <div id="unity-logo-title-footer" ></div> -->
        <div id="unity-fullscreen-button"></div>
        <!-- <div id="unity-build-title">Interactive Tree</div> -->
      </div>
    </div>
   
    <script>
  var canvas = document.querySelector("#unity-canvas");
  var fullscreenButton = null;
  var unityInstanceRef = null;

  function unityShowBanner(msg, type) { /* (keep your existing function) */ }

  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/TreeWebGL-07-10-25.loader.js";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/TreeWebGL-07-10-25.data.unityweb",
    frameworkUrl: buildUrl + "/TreeWebGL-07-10-25.framework.js.unityweb",
    codeUrl: buildUrl + "/TreeWebGL-07-10-25.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Tree",
    productName: "TreeWebGl",
    productVersion: "0.1.0",
    showBanner: unityShowBanner,
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    document.querySelector("#unity-container").className = "unity-mobile";
    canvas.className = "unity-mobile";
  } else {
    canvas.style.width = "100%";
    canvas.style.height = "100%";
  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
    }).then((unityInstance) => {
      document.querySelector("#unity-loading-bar").style.display = "none";
      fullscreenButton = document.querySelector("#unity-fullscreen-button");
      unityInstanceRef = unityInstance;

      // 🟢 Handle fullscreen button visibility & mode
      function handleOrientation() {
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        if (isPortrait) {
          // Portrait mode → enter fullscreen
          fullscreenButton.style.display = "block";
          
         // unityInstanceRef.SetFullscreen(1);
        } else {
          // Landscape mode → hide fullscreen button
          fullscreenButton.style.display = "none";
        }
      }

      // Run once and whenever orientation changes
      handleOrientation();
      window.addEventListener("orientationchange", handleOrientation);
      window.addEventListener("resize", handleOrientation);

      // Default fullscreen button behavior
      fullscreenButton.onclick = () => unityInstanceRef.SetFullscreen(1);
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);
</script>

  </body>
</html>
